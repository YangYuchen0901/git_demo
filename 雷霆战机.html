<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆战机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Microsoft YaHei', sans-serif;
  }
  canvas { display: block; border: 1px solid #333; }
  .info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 14px;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="info">方向键 / WASD 移动 &nbsp;|&nbsp; J / 空格 射击 &nbsp;|&nbsp; 收集道具强化火力</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 480, H = 720;
canvas.width = W;
canvas.height = H;

// ----- 星星背景 -----
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 2 + 0.5,
    speed: Math.random() * 2 + 0.5,
    alpha: Math.random() * 0.6 + 0.4
  });
}

// ----- 音效 (振荡器) -----
function playBeep(freq, duration, type = 'square', vol = 0.08) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + duration);
  } catch(e) {}
}

function sfxShoot() { playBeep(800, 0.06, 'square', 0.04); }
function sfxHit() { playBeep(120, 0.12, 'sawtooth', 0.06); }
function sfxExplosion() { playBeep(50, 0.25, 'sawtooth', 0.1); }
function sfxPowerUp() { playBeep(1200, 0.15, 'square', 0.06); playBeep(1600, 0.15, 'square', 0.06); }
function sfxBossAlert() { playBeep(200, 0.3, 'sawtooth', 0.08); }

// ----- 游戏状态 -----
let gameState = 'start'; // start | playing | over
let score = 0;
let highScore = localStorage.getItem('thunderHighScore') || 0;
let lives = 3;
let level = 1;
let invincibleTimer = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// ----- 玩家 -----
const player = {
  x: W / 2, y: H - 100,
  w: 40, h: 48,
  speed: 6,
  fireRate: 12,
  fireCooldown: 0,
  powerLevel: 1,    // 1=单发 2=双发 3=三发 4=扇形
  shieldActive: false,
  shieldTimer: 0,
  rapidFire: false,
  rapidTimer: 0,
};

// ----- 弹幕 -----
const bullets = [];
const enemyBullets = [];

// ----- 敌人 -----
const enemies = [];

// ----- 粒子 -----
const particles = [];

// ----- 道具 -----
const powerUps = [];

// ----- 敌人类型 -----
const EnemyTypes = {
  small:  { w: 28, h: 28, hp: 1, speed: 2.5, score: 100, color: '#f44', shootChance: 0 },
  medium: { w: 36, h: 36, hp: 3, speed: 1.8, score: 250, color: '#f80', shootChance: 0.004 },
  large:  { w: 48, h: 48, hp: 6, speed: 1.2, score: 500, color: '#c0f', shootChance: 0.012 },
  boss:   { w: 80, h: 80, hp: 40, speed: 0.8, score: 3000, color: '#f0f', shootChance: 0.04 },
};

// ----- 输入 -----
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
  if (gameState === 'start' && (e.key === ' ' || e.key === 'j' || e.key === 'J')) {
    startGame();
  }
  if (gameState === 'over' && (e.key === ' ' || e.key === 'j' || e.key === 'J' || e.key === 'Enter')) {
    startGame();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function isShooting() {
  return keys[' '] || keys['j'] || keys['J'] || keys['z'] || keys['Z'];
}

// ----- 碰撞检测 -----
function rectCollide(a, b) {
  return (
    a.x - a.w/2 < b.x + b.w/2 &&
    a.x + a.w/2 > b.x - b.w/2 &&
    a.y - a.h/2 < b.y + b.h/2 &&
    a.y + a.h/2 > b.y - b.h/2
  );
}

// ----- 发射子弹 -----
function spawnBullet(x, y, angle) {
  const speed = 8;
  return {
    x, y,
    vx: Math.sin(angle) * speed,
    vy: -Math.cos(angle) * speed,
    w: 4, h: 12,
    color: '#0ff',
  };
}

function playerShoot() {
  const p = player;
  const cx = p.x, cy = p.y - p.h / 2;
  sfxShoot();

  if (p.powerLevel >= 4) {
    // 扇形5发
    for (let a = -0.3; a <= 0.3; a += 0.15) {
      bullets.push(spawnBullet(cx, cy, a));
    }
  } else if (p.powerLevel === 3) {
    // 三发
    bullets.push(spawnBullet(cx, cy, 0));
    bullets.push(spawnBullet(cx - 10, cy + 8, 0));
    bullets.push(spawnBullet(cx + 10, cy + 8, 0));
  } else if (p.powerLevel === 2) {
    // 双发
    bullets.push(spawnBullet(cx - 8, cy, 0));
    bullets.push(spawnBullet(cx + 8, cy, 0));
  } else {
    // 单发
    bullets.push(spawnBullet(cx, cy, 0));
  }
}

function enemyShoot(enemy) {
  const angle = Math.atan2(player.x - enemy.x, player.y - enemy.y);
  enemyBullets.push({
    x: enemy.x, y: enemy.y + enemy.h / 2,
    vx: Math.sin(angle) * 4,
    vy: Math.cos(angle) * 4,
    w: 6, h: 6,
  });
}

// ----- 粒子效果 -----
function spawnParticles(x, y, count, color, spread = 3) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * spread;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.04 + 0.02,
      color,
      r: Math.random() * 2.5 + 1,
    });
  }
}

// ----- 生成敌人 -----
let spawnTimer = 0;
let bossSpawned = false;
let bossTimer = 0;

function spawnEnemy(type) {
  const t = EnemyTypes[type];
  enemies.push({
    x: Math.random() * (W - 80) + 40,
    y: -40,
    w: t.w, h: t.h,
    hp: t.hp,
    maxHp: t.hp,
    speed: t.speed + level * 0.2,
    score: t.score,
    color: t.color,
    shootChance: t.shootChance,
    type,
  });
}

function spawnPowerUp(x, y) {
  const types = ['power', 'rapid', 'shield', 'life'];
  const weights = [40, 30, 20, 10];
  const roll = Math.random() * 100;
  let acc = 0, type = types[0];
  for (let i = 0; i < types.length; i++) {
    acc += weights[i];
    if (roll <= acc) { type = types[i]; break; }
  }
  const colors = { power: '#0ff', rapid: '#ff0', shield: '#0f0', life: '#f44' };
  const labels = { power: 'P', rapid: 'R', shield: 'S', life: '+' };
  powerUps.push({
    x, y,
    vy: 1.5,
    type,
    color: colors[type],
    label: labels[type],
    life: 600,
  });
}

// ----- 开始 / 重置 -----
function startGame() {
  gameState = 'playing';
  score = 0;
  lives = 3;
  level = 1;
  invincibleTimer = 0;
  shakeTimer = 0;
  player.x = W / 2;
  player.y = H - 100;
  player.powerLevel = 1;
  player.shieldActive = false;
  player.shieldTimer = 0;
  player.rapidFire = false;
  player.rapidTimer = 0;
  bullets.length = 0;
  enemyBullets.length = 0;
  enemies.length = 0;
  particles.length = 0;
  powerUps.length = 0;
  spawnTimer = 0;
  bossSpawned = false;
  bossTimer = 0;
}

// ----- 更新逻辑 -----
function update() {
  if (gameState !== 'playing') return;

  // 移动玩家
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx = -1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx = 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) dy = -1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) dy = 1;

  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  player.x += (dx / len) * player.speed;
  player.y += (dy / len) * player.speed;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

  // 射击
  if (player.rapidFire) {
    player.fireRate = 4;
  } else {
    player.fireRate = 12;
  }
  player.fireCooldown--;
  if (isShooting() && player.fireCooldown <= 0) {
    playerShoot();
    player.fireCooldown = player.fireRate;
  }

  // 无敌时间
  if (invincibleTimer > 0) invincibleTimer--;

  // 护盾计时
  if (player.shieldTimer > 0) {
    player.shieldTimer--;
    if (player.shieldTimer <= 0) player.shieldActive = false;
  }

  // 速射计时
  if (player.rapidTimer > 0) {
    player.rapidTimer--;
    if (player.rapidTimer <= 0) player.rapidFire = false;
  }

  // 震屏
  if (shakeTimer > 0) shakeTimer--;

  // 弹幕更新
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y > H + 20 || b.x < -20 || b.x > W + 20) enemyBullets.splice(i, 1);
  }

  // 敌人更新 & 碰撞
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;

    // Boss 水平移动
    if (e.type === 'boss') {
      e.x += Math.sin(e.y * 0.02) * 1.5;
      e.x = Math.max(e.w / 2, Math.min(W - e.w / 2, e.x));
    }

    // 敌人射击
    if (Math.random() < e.shootChance * (1 + level * 0.1)) {
      enemyShoot(e);
    }

    // 敌人出屏
    if (e.y > H + 60) {
      enemies.splice(i, 1);
      continue;
    }

    // 玩家子弹 vs 敌人
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (rectCollide(bullets[j], e)) {
        e.hp--;
        spawnParticles(bullets[j].x, bullets[j].y, 3, '#ff8', 2);
        bullets.splice(j, 1);
        sfxHit();
        if (e.hp <= 0) {
          score += e.score;
          spawnParticles(e.x, e.y, 20, e.color, 5);
          if (e.type === 'boss') {
            sfxExplosion();
            spawnParticles(e.x, e.y, 50, '#fff', 8);
            shakeTimer = 20;
            shakeIntensity = 6;
            bossSpawned = false;
            level++;
            // 提高分数档位
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('thunderHighScore', highScore);
            }
          } else {
            sfxExplosion();
          }
          // 掉落概率
          if (Math.random() < (e.type === 'boss' ? 1 : e.type === 'large' ? 0.35 : 0.08)) {
            spawnPowerUp(e.x, e.y);
          }
          enemies.splice(i, 1);
          break;
        }
      }
    }
  }

  // 道具更新
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const pu = powerUps[i];
    pu.y += pu.vy;
    pu.life--;
    if (pu.y > H + 20 || pu.life <= 0) { powerUps.splice(i, 1); continue; }
    if (rectCollide(player, pu)) {
      sfxPowerUp();
      if (pu.type === 'power') {
        player.powerLevel = Math.min(4, player.powerLevel + 1);
      } else if (pu.type === 'rapid') {
        player.rapidFire = true;
        player.rapidTimer = 360;
      } else if (pu.type === 'shield') {
        player.shieldActive = true;
        player.shieldTimer = 360;
      } else if (pu.type === 'life') {
        lives = Math.min(5, lives + 1);
      }
      spawnParticles(pu.x, pu.y, 10, pu.color, 3);
      powerUps.splice(i, 1);
    }
  }

  // 敌人子弹 vs 玩家
  if (invincibleTimer <= 0) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      if (rectCollide(enemyBullets[i], player)) {
        enemyBullets.splice(i, 1);
        hitPlayer();
      }
    }
    // 敌机碰撞玩家
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (rectCollide(enemies[i], player)) {
        spawnParticles(enemies[i].x, enemies[i].y, 15, '#fff', 4);
        enemies.splice(i, 1);
        hitPlayer();
      }
    }
  }

  function hitPlayer() {
    if (player.shieldActive) {
      spawnParticles(player.x, player.y, 10, '#0f0', 3);
      return;
    }
    lives--;
    invincibleTimer = 90;
    player.powerLevel = Math.max(1, player.powerLevel - 1);
    shakeTimer = 12;
    shakeIntensity = 4;
    spawnParticles(player.x, player.y, 30, '#f44', 6);
    sfxExplosion();
    if (lives <= 0) {
      gameState = 'over';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('thunderHighScore', highScore);
      }
      spawnParticles(player.x, player.y, 60, '#ff0', 10);
    }
  }

  // 粒子更新
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // 生成敌机
  spawnTimer++;
  const spawnInterval = Math.max(15, 45 - level * 3);
  if (spawnTimer >= spawnInterval && enemies.length < 8 + level * 2) {
    spawnTimer = 0;
    const r = Math.random();
    if (r < 0.55) spawnEnemy('small');
    else if (r < 0.85) spawnEnemy('medium');
    else spawnEnemy('large');
  }

  // Boss
  bossTimer++;
  if (bossTimer > 1800 + level * 300 && !bossSpawned) {
    bossSpawned = true;
    bossTimer = 0;
    spawnEnemy('boss');
    EnemyTypes.boss.hp = 30 + level * 10;
    sfxBossAlert();
  }

  // 星空
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

// ----- 绘制 -----
function drawShip(x, y, w, h, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);

  // 引擎光焰
  const flicker = Math.random() * 6;
  ctx.fillStyle = '#f80';
  ctx.beginPath();
  ctx.moveTo(-6, h/2);
  ctx.lineTo(0, h/2 + 12 + flicker);
  ctx.lineTo(6, h/2);
  ctx.fill();
  ctx.fillStyle = '#ff4';
  ctx.beginPath();
  ctx.moveTo(-3, h/2);
  ctx.lineTo(0, h/2 + 7 + flicker * 0.7);
  ctx.lineTo(3, h/2);
  ctx.fill();

  // 机身
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(-w/2, h/3);
  ctx.lineTo(-w/4, h/2);
  ctx.lineTo(w/4, h/2);
  ctx.lineTo(w/2, h/3);
  ctx.closePath();
  ctx.fill();

  // 机舱
  const grad = ctx.createLinearGradient(0, -h/4, 0, h/4);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(1, '#0af');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, -2, 6, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // 机翼线
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-w/2 + 4, h/3);
  ctx.lineTo(0, 0);
  ctx.lineTo(w/2 - 4, h/3);
  ctx.stroke();

  ctx.restore();
}

function drawEnemy(x, y, e) {
  ctx.save();
  ctx.translate(x, y);

  if (e.type === 'boss') {
    // Boss外观
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(0, -e.h/2);
    ctx.lineTo(-e.w/2, e.h/3);
    ctx.lineTo(-e.w/3, e.h/2);
    ctx.lineTo(e.w/3, e.h/2);
    ctx.lineTo(e.w/2, e.h/3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 3;
    ctx.stroke();

    // Boss核心
    const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, 20);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.5, '#f0f');
    grad.addColorStop(1, '#80f');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();

    // Boss眼睛
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(-15, -8, 6, 0, Math.PI * 2);
    ctx.arc(15, -8, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-15, -8, 3, 0, Math.PI * 2);
    ctx.arc(15, -8, 3, 0, Math.PI * 2);
    ctx.fill();

    // 血条
    const barW = e.w;
    const barH = 6;
    ctx.fillStyle = '#400';
    ctx.fillRect(-barW/2, -e.h/2 - 14, barW, barH);
    ctx.fillStyle = '#f0f';
    ctx.fillRect(-barW/2, -e.h/2 - 14, barW * (e.hp / e.maxHp), barH);
  } else {
    // 普通敌机
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.moveTo(0, -e.h/2);
    ctx.lineTo(-e.w/2, e.h/3);
    ctx.lineTo(0, e.h/2);
    ctx.lineTo(e.w/2, e.h/3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 核心
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, e.w * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  if (gameState === 'start') {
    drawStarBackground();
    drawTitleScreen();
    return;
  }

  // 震屏偏移
  let shakeX = 0, shakeY = 0;
  if (shakeTimer > 0) {
    shakeX = (Math.random() - 0.5) * shakeIntensity * 2;
    shakeY = (Math.random() - 0.5) * shakeIntensity * 2;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // 星空
  drawStarBackground();

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 道具
  for (const pu of powerUps) {
    const pulse = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = pu.color;
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pu.label, pu.x, pu.y);
  }
  ctx.globalAlpha = 1;

  // 玩家子弹
  for (const b of bullets) {
    const grad = ctx.createLinearGradient(b.x, b.y - b.h/2, b.x, b.y + b.h/2);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#0af');
    ctx.fillStyle = grad;
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  }

  // 敌人子弹
  for (const b of enemyBullets) {
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w/2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff8';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.w/4, 0, Math.PI * 2);
    ctx.fill();
  }

  // 敌人
  for (const e of enemies) {
    drawEnemy(e.x, e.y, e);
  }

  // 玩家
  if (gameState === 'playing' && (invincibleTimer <= 0 || Math.floor(invincibleTimer / 4) % 2 === 0)) {
    drawShip(player.x, player.y, player.w, player.h, '#0cf');
  }

  // 护盾
  if (player.shieldActive) {
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.w * 0.8, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();

  // HUD (不受震屏影响)
  drawHUD();

  if (gameState === 'over') {
    drawGameOver();
  }
}

function drawStarBackground() {
  for (const s of stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTitleScreen() {
  // 标题
  const t = Date.now() * 0.002;
  const glow = Math.sin(t) * 0.3 + 0.7;
  ctx.save();
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 20 * glow;
  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 48px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('雷霆战机', W / 2, H / 2 - 80);

  ctx.shadowBlur = 10;
  ctx.fillStyle = '#fff';
  ctx.font = '20px "Microsoft YaHei"';
  ctx.fillText('THUNDER FIGHTER', W / 2, H / 2 - 35);

  // 演示飞船
  ctx.shadowBlur = 0;
  drawShip(W / 2, H / 2 + 30, 50, 60, '#0cf');

  // 开始提示
  const blink = Math.sin(t * 1.5) > 0;
  if (blink) {
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.fillText('按 空格键 或 J 开始游戏', W / 2, H / 2 + 130);
  }

  ctx.restore();
  ctx.fillStyle = '#888';
  ctx.font = '14px "Microsoft YaHei"';
  ctx.fillText(`最高分: ${highScore}`, W / 2, H / 2 + 170);
}

function drawHUD() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Microsoft YaHei"';
  ctx.textAlign = 'left';
  ctx.fillText(`分数: ${score}`, 12, 28);
  ctx.textAlign = 'right';
  ctx.fillText(`等级: ${level}`, W - 12, 28);

  // 生命
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    ctx.arc(20 + i * 24, 50, 8, 0, Math.PI * 2);
    ctx.fill();
  }

  // 火力等级
  const pColors = ['#888', '#0ff', '#0ff', '#ff0', '#f0f'];
  ctx.fillStyle = pColors[player.powerLevel];
  ctx.font = 'bold 12px "Microsoft YaHei"';
  ctx.textAlign = 'left';
  ctx.fillText(`火力 Lv${player.powerLevel}`, 12, 76);

  // 道具状态
  ctx.textAlign = 'right';
  let statusY = 50;
  if (player.shieldActive) {
    ctx.fillStyle = '#0f0';
    ctx.fillText(`护盾 ${Math.ceil(player.shieldTimer / 60)}s`, W - 12, statusY);
    statusY += 20;
  }
  if (player.rapidFire) {
    ctx.fillStyle = '#ff0';
    ctx.fillText(`速射 ${Math.ceil(player.rapidTimer / 60)}s`, W - 12, statusY);
    statusY += 20;
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#f44';
  ctx.font = 'bold 42px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', W / 2, H / 2 - 50);

  ctx.fillStyle = '#fff';
  ctx.font = '20px "Microsoft YaHei"';
  ctx.fillText(`最终得分: ${score}`, W / 2, H / 2 + 5);
  ctx.fillText(`最高分: ${highScore}`, W / 2, H / 2 + 35);

  const blink = Math.sin(Date.now() * 0.003) > 0;
  if (blink) {
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 20px "Microsoft YaHei"';
    ctx.fillText('按 空格键 或 Enter 重新开始', W / 2, H / 2 + 85);
  }
}

// ----- 游戏循环 -----
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
